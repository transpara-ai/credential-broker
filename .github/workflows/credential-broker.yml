# Only the protected main branch may request the Human-reviewed environment.
# Environment policy must be configured and read back before any secret is added.
name: credential broker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Reviewed operation to run
        required: true
        type: choice
        options:
          - harbor-auth-check

permissions:
  contents: read

concurrency:
  group: credential-broker-${{ github.event.inputs.operation }}
  cancel-in-progress: false

jobs:
  harbor-auth-check:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'harbor-auth-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: credential-broker
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check Harbor robot scope
        env:
          HARBOR_TOKEN_URL: ${{ secrets.HARBOR_TOKEN_URL }}
          HARBOR_REPOSITORY: ${{ secrets.HARBOR_REPOSITORY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: python3 services/harbor_auth_check.py
